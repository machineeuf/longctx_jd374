[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "machineeuf-longctx_jd374"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出长上下文优化工程师·作业抢占与调度公平性上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "machineeuf" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://machineeuf.github.io"
Repository = "https://github.com/machineeuf/longctx_jd374"
Issues = "https://github.com/machineeuf/longctx_jd374/issues"

[project.scripts]
longctx_jd374 = "longctx_jd374:main"

[tool.setuptools]
py-modules = ["longctx_jd374"]
